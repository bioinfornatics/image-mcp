name: CI

on:
  push:
    branches: [main, master, develop]
    tags: ['v*.*.*']
  pull_request:
    branches: [main, master]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ─── Quality Gate ──────────────────────────────────────────────────────────
  quality:
    name: Lint · Type-check · Test · Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.12'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify quality-gate.sh resolves project root and propagates exit codes (run from an unrelated cwd)
        run: |
          chmod +x bin/quality-gate.sh
          set +e
          (cd /tmp && "${GITHUB_WORKSPACE}/bin/quality-gate.sh" not-a-real-gate)
          EC=$?
          set -e
          if [ "$EC" -eq 0 ]; then
            echo "❌ quality-gate.sh reported success for an unknown gate — exit-code propagation is broken" >&2
            exit 1
          fi
          echo "✅ quality-gate.sh correctly returned non-zero ($EC) for an invalid gate from cwd=/tmp"

      - name: Lint
        run: bun run lint

      - name: Type-check
        run: bun run type-check

      - name: Unit & Integration Tests
        run: bun test --coverage
        env:
          IMAGE_PROVIDER: openai
          IMAGE_API_KEY: sk-test-fake-key-for-ci
          IMAGE_MCP_TRANSPORT: http
          IMAGE_PORT: 3001
          IMAGE_LOG_LEVEL: error
          IMAGE_OUTPUT_DIR: /tmp/image-mcp-test-output
          IMAGE_USE_ELICITATION: "false"
          IMAGE_USE_SAMPLING: "false"
          IMAGE_MAX_REQUESTS_PER_MINUTE: "1000"

      - name: Check coverage thresholds (aggregate, excluding bootstrap files)
        run: |
          # Parse the lcov.info file produced by bun --coverage.
          # Excludes the two pure-DI bootstrap files that are intentionally uncovered:
          #   - providers/providers.module.ts  (NestJS DI factory)
          #   - transport/stdio.bootstrap.ts   (stdio-only runtime)
          python3 - <<'EOF'
          import sys, re

          lcov = open("coverage/lcov.info").read()
          EXCLUDE = {"providers.module.ts", "stdio.bootstrap.ts"}

          total_lines_found = total_lines_hit = total_fn_found = total_fn_hit = 0

          for block in lcov.strip().split("end_of_record"):
              sf = re.search(r"SF:(.+)", block)
              if not sf:
                  continue
              filename = sf.group(1).split("/")[-1]
              if filename in EXCLUDE:
                  continue
              for lf in re.findall(r"LF:(\d+)", block):
                  total_lines_found += int(lf)
              for lh in re.findall(r"LH:(\d+)", block):
                  total_lines_hit += int(lh)
              for fnf in re.findall(r"FNF:(\d+)", block):
                  total_fn_found += int(fnf)
              for fnh in re.findall(r"FNH:(\d+)", block):
                  total_fn_hit += int(fnh)

          line_pct = (total_lines_hit / total_lines_found * 100) if total_lines_found else 0
          fn_pct   = (total_fn_hit   / total_fn_found   * 100) if total_fn_found   else 0

          print(f"Coverage (excl. bootstrap): Functions={fn_pct:.2f}%  Lines={line_pct:.2f}%")
          fail = False
          if fn_pct < 90:
              print(f"❌ Function coverage {fn_pct:.2f}% < 90%")
              fail = True
          else:
              print(f"✅ Function coverage {fn_pct:.2f}% ≥ 90%")
          if line_pct < 90:
              print(f"❌ Line coverage {line_pct:.2f}% < 90%")
              fail = True
          else:
              print(f"✅ Line coverage {line_pct:.2f}% ≥ 90%")
          sys.exit(1 if fail else 0)
          EOF

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

      - name: Build TypeScript
        run: bun run build
        env:
          NODE_ENV: production

      - name: Verify bin entrypoint is executable
        run: |
          test -x dist/main.js && echo "dist/main.js is executable ✅" || (echo "dist/main.js is NOT executable ❌" && exit 1)
          head -1 dist/main.js | grep -q "^#!" && echo "shebang present ✅" || (echo "shebang missing ❌" && exit 1)

      - name: Upload dist artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          retention-days: 1

  # ─── Native Windows path regression ───────────────────────────────────────
  windows-paths:
    name: Windows Path Regression
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.12'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test Windows file URI, Roots save, allowlist, and output path handling
        run: bun test test/unit/mcp/features/path-utils.spec.ts test/unit/mcp/features/roots.service.spec.ts test/unit/mcp/features/image-storage.service.spec.ts test/unit/security/sanitise.spec.ts

      - name: Type-check
        run: bun run type-check

  # ─── Security Audit ────────────────────────────────────────────────────────
  security:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.12'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit dependencies
        run: bun audit --audit-level=high

  # ─── Docker Build + Trivy Scan ─────────────────────────────────────────────
  docker:
    name: Docker Build · Trivy Scan
    runs-on: ubuntu-latest
    needs: [quality, windows-paths]

    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          tags: image-mcp:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      - name: Test container health
        run: |
          docker run -d --name mcp-test \
            -e IMAGE_PROVIDER=openai \
            -e IMAGE_API_KEY=sk-fake-ci-key \
            -e IMAGE_REQUIRE_MCP_AUTH=false \
            -e IMAGE_HTTP_HOST=0.0.0.0 \
            -p 3002:3000 \
            image-mcp:ci
          for i in $(seq 1 12); do
            if curl -sf http://localhost:3002/health/live; then
              echo "Container healthy after ${i}×5s"
              break
            fi
            echo "Waiting... ($i/12)"
            sleep 5
          done
          curl -f http://localhost:3002/health/live || (docker logs mcp-test && exit 1)
          docker stop mcp-test

      - name: Verify patched OpenSSL packages
        run: |
          docker run --rm --entrypoint sh image-mcp:ci -lc \
            "apk list --installed 2>/dev/null | grep -E '^(libcrypto3|libssl3)-3\\.5\\.8-r0'"

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: image-mcp:ci
          format: table
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true

      - name: Build and push to ghcr.io (on tag or main branch)
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── GitHub Packages (npm.pkg.github.com) ────────────────────────────────
  # Triggered only on semver tags (v*.*.*).
  # Uses the built-in GITHUB_TOKEN — no extra secret required.
  # Package name must be scoped: @bioinfornatics/image-mcp (set in package.json).
  # Auth: bun publish reads BUN_AUTH_TOKEN (not NODE_AUTH_TOKEN).
  # Install: bun add @bioinfornatics/image-mcp --registry https://npm.pkg.github.com
  # ────────────────────────────────────────────────────────────────────────────
  publish-gpr:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest
    needs: [quality, docker]
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: read
      packages: write   # required to push to npm.pkg.github.com

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.12'

      - name: Install all dependencies (build requires tsc from devDeps)
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Verify package version matches tag
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG_VERSION=$(bun -e "console.log(require('./package.json').version)")
          if [ "$TAG" != "$PKG_VERSION" ]; then
            echo "❌ Tag v$TAG does not match package.json version $PKG_VERSION"
            echo "   Update package.json version before tagging."
            exit 1
          fi
          echo "✅ Tag v$TAG matches package.json version"

      - name: Show package contents (preview)
        # bun pm pack --dry-run: lists files without publishing or auth check
        run: bun pm pack --dry-run

      - name: Publish to GitHub Packages
        # Uses npm publish (not bun) — npm reliably reads ~/.npmrc for non-default
        # registry auth. bun publish only uses BUN_AUTH_TOKEN for the default registry.
        # Idempotent: 409 Conflict means version already exists — treat as success.
        run: |
          echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" >> ~/.npmrc
          echo "@bioinfornatics:registry=https://npm.pkg.github.com" >> ~/.npmrc
          npm publish --access public --ignore-scripts --registry https://npm.pkg.github.com \
            2>&1 | tee /tmp/npm_gpr_out.txt; EC=${PIPESTATUS[0]}
          if [ $EC -eq 0 ]; then
            echo "✅ Published successfully"
          elif grep -qE "E409|Cannot publish over existing|already exists" /tmp/npm_gpr_out.txt; then
            echo "✅ Version already published to GitHub Packages — skipping"
          else
            exit $EC
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Confirm published version
        run: |
          VERSION=$(bun -e "console.log(require('./package.json').version)")
          echo "✅ Published: https://github.com/bioinfornatics/image-mcp/pkgs/npm/image-mcp"
          echo "   Install: bun add @bioinfornatics/image-mcp@$VERSION --registry https://npm.pkg.github.com"

  # ─── npmjs.com Publish ────────────────────────────────────────────────────
  # Triggered only on semver tags (v*.*.*).
  # Uses NPM_TOKEN secret (granular token, 2FA bypass enabled).
  #
  # Future: once v0.0.2 exists on npmjs.com, switch to OIDC Trusted Publishing:
  #   npmjs.com → package Settings → Publishing → Trusted Publishing → Add GitHub Actions
  #   Then remove NPM_TOKEN secret and add `id-token: write` permission here.
  # ────────────────────────────────────────────────────────────────────────────
  publish-npm:
    name: Publish to npmjs.com
    runs-on: ubuntu-latest
    needs: [quality, docker]
    if: startsWith(github.ref, 'refs/tags/v') && vars.NPMJS_PUBLISH_ENABLED == 'true'

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.12'

      - name: Verify npmjs publishing identity
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          printf '%s\n' '//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}' >> ~/.npmrc
          IDENTITY=$(npm whoami --registry https://registry.npmjs.org)
          if [ "$IDENTITY" != "bioinfornatics" ]; then
            echo "❌ Expected npmjs identity 'bioinfornatics', got '$IDENTITY'"
            exit 1
          fi
          MAINTAINERS=$(npm view @bioinfornatics/image-mcp maintainers --json \
            --registry https://registry.npmjs.org)
          node -e '
            const maintainers = JSON.parse(process.argv[1]);
            const values = Array.isArray(maintainers) ? maintainers : [maintainers];
            if (!values.some((value) => String(value).startsWith("bioinfornatics "))) {
              console.error("❌ npmjs package is not maintained by bioinfornatics");
              process.exit(1);
            }
          ' "$MAINTAINERS"
          echo "✅ npmjs identity and package ownership verified"

      - name: Install all dependencies (build requires tsc from devDeps)
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Verify package version matches tag
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG_VERSION=$(bun -e "console.log(require('./package.json').version)")
          if [ "$TAG" != "$PKG_VERSION" ]; then
            echo "❌ Tag v$TAG does not match package.json version $PKG_VERSION"
            echo "   Update package.json version before tagging."
            exit 1
          fi
          echo "✅ Tag v$TAG matches package.json version"

      - name: Show package contents (preview)
        run: bun pm pack --dry-run

      - name: Publish to npmjs.com
        # npm publish with ~/.npmrc token auth. --registry overrides publishConfig
        # (which points to GitHub Packages). Idempotent: 409 = already exists.
        run: |
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" >> ~/.npmrc
          npm publish --access public --ignore-scripts --registry https://registry.npmjs.org \
            2>&1 | tee /tmp/npm_out.txt; EC=${PIPESTATUS[0]}
          if [ $EC -eq 0 ]; then
            echo "✅ Published to npmjs.com successfully"
          elif grep -qE "E409|cannot publish over|already exists" /tmp/npm_out.txt; then
            echo "✅ Version already published to npmjs.com — skipping"
          else
            cat /tmp/npm_out.txt
            exit $EC
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Confirm published version
        run: |
          VERSION=$(bun -e "console.log(require('./package.json').version)")
          echo "✅ Published: https://www.npmjs.com/package/@bioinfornatics/image-mcp/v/$VERSION"
          echo "   Install: bun add @bioinfornatics/image-mcp@$VERSION"

  # ─── GitHub Release Notes ──────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [publish-gpr]
    # publish-npm is continue-on-error — release proceeds as long as GitHub Packages succeeded
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Create or Update GitHub Release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            const version = tag.replace(/^v/, '');
            const body = [
              `## Install`,
              ``,
              `### GitHub Packages`,
              `\`\`\`bash`,
              `bun add @bioinfornatics/image-mcp@${version} --registry https://npm.pkg.github.com`,
              `\`\`\``,
              ``,
              `### npmjs.com`,
              `\`\`\`bash`,
              `# Zero-install (Claude Desktop / Goose / Cursor):`,
              `bun x --bun @bioinfornatics/image-mcp@${version}`,
              ``,
              `# Global install:`,
              `bun add -g @bioinfornatics/image-mcp@${version}`,
              `\`\`\``,
              ``,
              `## Docker`,
              `\`\`\`bash`,
              `docker pull ghcr.io/\${{ github.repository }}:${version}`,
              `\`\`\``,
              ``,
              `---`,
              ``,
            ].join('\n');
            const params = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `Release ${tag}`,
              body,
              generate_release_notes: true,
              draft: false,
              prerelease: tag.includes('-'),
            };
            // Upsert: update if release already exists, create otherwise
            const existing = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag: tag,
            }).catch(() => null);
            if (existing) {
              await github.rest.repos.updateRelease({
                ...params,
                release_id: existing.data.id,
              });
              console.log(`Updated release ${tag}`);
            } else {
              await github.rest.repos.createRelease(params);
              console.log(`Created release ${tag}`);
            }
