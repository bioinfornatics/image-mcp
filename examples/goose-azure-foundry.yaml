# Replace YOUR-RESOURCE, YOUR-PROJECT, and MAI-Image-2.5 with values from Foundry.
# The deployment is the customer-chosen deployment name, which may differ from the model name.
extensions:
  imagemcp:
    enabled: true
    type: stdio
    name: Image MCP
    cmd: npx
    args:
      - --yes
      - "@bioinfornatics/image-mcp@0.4.0"
      - --base-url
      - https://YOUR-RESOURCE.services.ai.azure.com
      - --foundry-project-endpoint
      - https://YOUR-RESOURCE.services.ai.azure.com/api/projects/YOUR-PROJECT
      - --deployment
      - MAI-Image-2.5
      - --transport
      - stdio
    env_keys:
      - IMAGE_API_KEY
    timeout: 300
