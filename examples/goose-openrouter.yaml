# Store the OpenRouter key as IMAGE_API_KEY with `goose configure`.
extensions:
  imagemcp:
    enabled: true
    type: stdio
    name: Image MCP — OpenRouter
    cmd: npx
    args:
      - --yes
      - "@bioinfornatics/image-mcp@0.4.0"
      - --base-url
      - https://openrouter.ai/api/v1
      - --model
      - google/gemini-3.1-flash-image
      - --transport
      - stdio
    env_keys:
      - IMAGE_API_KEY
    timeout: 300
