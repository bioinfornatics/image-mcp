version: '3.9'

# ─────────────────────────────────────────────────────────────────────────────
# RECOMMENDED: use Docker secrets instead of plain env vars for API keys.
#
#   echo "sk-your-real-key" | docker secret create image_api_key -
#   echo "your-mcp-key"     | docker secret create mcp_api_key -
#
# Then deploy with:
#   docker stack deploy -c docker-compose.yml image-mcp
#
# Plain IMAGE_API_KEY env var still works for dev (no _FILE needed).
# ─────────────────────────────────────────────────────────────────────────────

secrets:
  image_api_key:
    external: true          # created with: docker secret create image_api_key -
  mcp_api_key:
    external: true

services:
  image-mcp:
    build: .
    ports:
      - "3000:3000"
    environment:
      - IMAGE_PROVIDER=${IMAGE_PROVIDER:-openai}
      - IMAGE_MCP_SECRET_BACKEND=file          # read *_FILE vars from /run/secrets/
      # Point to Docker secret mounts — server reads file contents at startup
      - IMAGE_API_KEY_FILE=/run/secrets/image_api_key
      - IMAGE_MCP_API_KEY_FILE=/run/secrets/mcp_api_key
      # Non-secret provider config (only needed for azure / custom)
      - IMAGE_BASE_URL=${IMAGE_BASE_URL:-}
      - IMAGE_DEPLOYMENT=${IMAGE_DEPLOYMENT:-}
      - IMAGE_API_VERSION=${IMAGE_API_VERSION:-2025-04-01-preview}
      - IMAGE_MODELS=${IMAGE_MODELS:-custom}
      # General config
      - IMAGE_MCP_TRANSPORT=${IMAGE_MCP_TRANSPORT:-http}
      - IMAGE_PORT=3000
      - IMAGE_DEFAULT_MODEL=${IMAGE_DEFAULT_MODEL:-gpt-image-2}
      - IMAGE_LOG_LEVEL=${IMAGE_LOG_LEVEL:-info}
      - IMAGE_MAX_REQUESTS_PER_MINUTE=${IMAGE_MAX_REQUESTS_PER_MINUTE:-60}
      - IMAGE_USE_ELICITATION=${IMAGE_USE_ELICITATION:-true}
      - IMAGE_USE_SAMPLING=${IMAGE_USE_SAMPLING:-true}
    secrets:
      - image_api_key
      - mcp_api_key
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:3000/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - image-mcp
    profiles:
      - monitoring
